<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px;
    height: 1820px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .canvas {
    width: 1200px;
    height: 1820px;
    background: #534AB7;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .tagline {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #C9C3F0;
    margin-top: 72px;
  }
  .headline {
    font-size: 58px;
    font-weight: 800;
    line-height: 1.18;
    color: #ffffff;
    text-align: center;
    max-width: 980px;
    margin-top: 24px;
    letter-spacing: -0.01em;
  }
  .frame-wrap {
    margin-top: 56px;
    position: relative;
  }
  .frame {
    width: 636px;
    height: 1372px;
    background: #0c0a16;
    border-radius: 56px;
    padding: 18px;
    box-shadow: 0 40px 90px rgba(0,0,0,0.45), 0 10px 30px rgba(0,0,0,0.3);
    position: relative;
  }
  .frame::before {
    content: "";
    position: absolute;
    top: 34px;
    left: 50%;
    transform: translateX(-50%);
    width: 130px;
    height: 26px;
    background: #0c0a16;
    border-radius: 20px;
    z-index: 2;
  }
  .screen {
    width: 600px;
    height: 1336px;
    border-radius: 40px;
    overflow: hidden;
    background: #fff;
    position: relative;
  }
  .screen img {
    width: 100%;
    height: 100%;
    object-fit: fill;
    display: block;
  }
  .devmenu-mask {
    position: absolute;
    left: 8px;
    top: 895px;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: #eef0f6;
    display: none;
  }
  .devmenu-mask.show { display: block; }
</style>
</head>
<body>
  <div class="canvas">
    <div class="tagline">LEMMORY</div>
    <div class="headline" id="headline"></div>
    <div class="frame-wrap">
      <div class="frame">
        <div class="screen">
          <img id="shot" src="" />
          <div class="devmenu-mask" id="mask"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
