packages:
  - "apps/*"
  - "packages/*"
virtualStoreDir: .pnpm
virtualStoreDirMaxLength: 30
allowBuilds:
  '@firebase/util': true
  better-sqlite3: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: true
minimumReleaseAgeExclude:
  - '@expo/cli@56.1.19'
  - '@expo/config-plugins@56.0.12'
  - '@expo/fingerprint@0.19.7'
  - '@expo/prebuild-config@56.0.19'
  - '@expo/router-server@56.0.16'
  - '@expo/ui@56.0.21'
  - babel-preset-expo@56.0.17
  - expo-asset@56.0.19
  - expo-modules-autolinking@56.0.19
  - expo-modules-core@56.0.20
  - expo-modules-jsi@56.0.12
  - expo-router@56.2.14
  - expo@56.0.15
  - react-native-nitro-modules@0.36.5
