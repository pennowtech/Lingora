# LINGORA-E2E-007 — deck detail exposes one Review action. The review session itself chooses all
# eligible formats enabled for the deck instead of asking the learner to pick a mode here.
appId: com.lingora.mobile
name: cloze_review_mode
tags:
  - tier1
---
- launchApp
- openLink: "lingora://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 90000
- tapOn:
    id: "tab-decks"
- tapOn: "My Vocabulary"
- assertVisible:
    id: "deck-review-button"
- assertNotVisible: "Practice cloze"
- assertNotVisible: "Practice reverse"
- assertNotVisible: "Mixed practice"
- tapOn:
    id: "deck-review-button"
- assertVisible: "mixed"
- assertVisible: "tap to reveal"
- tapOn: "tap to reveal"
- assertVisible: "Good"
- tapOn: "Good"
