# LINGORA-E2E-007 — cloze review mode via deck detail's "Practice cloze" button.
# Fixture: "ausgehen" ships with a seeded cloze_cards row — the SAME due card
# review_session_rate_card.yaml uses. Rating it in either flow advances its shared FSRS
# card_states row (real app behavior — one card_states row per card, not per review mode, not a
# flow bug), so whichever of these two flows runs SECOND on an already-seeded install will see
# "Nothing due right now" and fail. A full-suite run only gets one of them to pass unless the app
# gains a real "reset review state" dev affordance or the db is reseeded between them — tracked as
# an open item, not silently worked around here.
appId: com.lingora.mobile
name: cloze_review_mode
tags:
  - tier1
---
- launchApp
- openLink: "lingora://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 90000
- tapOn:
    id: "tab-decks"
- tapOn: "My Vocabulary"
- tapOn: "Practice cloze"
- assertVisible: "cloze"
- assertVisible: "tap to reveal"
- tapOn: "tap to reveal"
- assertVisible: "Good"
- tapOn: "Good"
