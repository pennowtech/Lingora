<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .canvas {
    width: 1024px;
    height: 500px;
    background: linear-gradient(135deg, #453c9e 0%, #534ab7 55%, #6a5fd1 100%);
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 70%);
    top: -180px;
    right: -80px;
  }
  .content {
    position: absolute;
    left: 60px;
    top: 0;
    bottom: 0;
    width: 460px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .wordmark {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.06em;
    color: #ffffff;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .wordmark .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #ffffff;
    display: inline-block;
  }
  .tagline {
    font-size: 46px;
    font-weight: 800;
    line-height: 1.14;
    color: #ffffff;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin-bottom: 18px;
  }
  .sub {
    font-size: 19px;
    font-weight: 500;
    color: #e3e0f7;
    line-height: 1.4;
    max-width: 460px;
  }
  .badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 26px;
  }
  .badge {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    background: rgba(255,255,255,0.16);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 999px;
    padding: 6px 13px;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .phone-wrap {
    position: absolute;
    right: -40px;
    top: 50%;
    transform: translateY(-50%) rotate(6deg);
    width: 330px;
    height: 690px;
    z-index: 2;
  }
  .phone-frame {
    width: 100%;
    height: 100%;
    background: #0c0a16;
    border-radius: 42px;
    padding: 13px;
    box-shadow: -20px 30px 60px rgba(0,0,0,0.4);
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 30px;
    overflow: hidden;
    background: #fff;
  }
  .phone-screen img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .phone-wrap-2 {
    position: absolute;
    right: 180px;
    top: 50%;
    transform: translateY(-46%) rotate(-9deg);
    width: 300px;
    height: 628px;
    z-index: 1;
  }
</style>
</head>
<body>
  <div class="canvas">
    <div class="glow"></div>
    <div class="phone-wrap-2">
      <div class="phone-frame">
        <div class="phone-screen"><img id="shot2" src="" /></div>
      </div>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame">
        <div class="phone-screen"><img id="shot1" src="" /></div>
      </div>
    </div>
    <div class="content">
      <div class="wordmark"><span class="dot"></span>LEMMORY</div>
      <div class="tagline">Learn words<br/>that actually stick.</div>
      <div class="sub">AI-powered lessons, real spaced repetition, and vocabulary that comes from your real life.</div>
      <div class="badges">
        <div class="badge">🧠 AI-Powered</div>
        <div class="badge">🔁 Spaced Repetition</div>
        <div class="badge">🆓 Free Offline Mode</div>
      </div>
    </div>
  </div>
</body>
</html>
